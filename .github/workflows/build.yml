name: PitchBlack Recovery Build

on:
  workflow_dispatch:
    inputs:
      manifest_branch:
        description: "PBRP Manifest Branch"
        required: true
        type: choice
        default: "android-12.1"
        options:
          - "android-12.1"
          - "android-14.0"
      device_tree_url:
        description: "Device Tree URL (leave blank for current repository)"
        required: false
        default: ""
      device_tree_branch:
        description: "Device Tree Branch (leave blank for current branch)"
        required: false
        default: ""
      clean_ccache:
        description: "Delete ccache before build?"
        required: true
        type: choice
        default: "no"
        options:
          - "no"
          - "yes"

jobs:
  build:
    name: Build Recovery
    runs-on: ubuntu-22.04
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CCACHE_DIR: /tmp/ccache
      CCACHE_EXEC: /usr/bin/ccache
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Free up disk space on the runner
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune -a -f || true
          df -h

      # Install ccache ONLY if not cleaning
      - name: Install ccache
        if: github.event.inputs.clean_ccache == 'no'
        run: sudo apt update && sudo apt install -y ccache

      # Restore cache ONLY if not cleaning
      - name: Setup ccache
        if: github.event.inputs.clean_ccache == 'no'
        uses: actions/cache@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ runner.os }}-pbrp-${{ github.run_id }}
          restore-keys: |
            ccache-${{ runner.os }}-pbrp-

      # Delete cache completely if requested
      - name: Remove ccache completely
        if: github.event.inputs.clean_ccache == 'yes'
        run: |
          sudo rm -rf ${{ env.CCACHE_DIR }}
          echo "ccache removed successfully"

      # Configure ccache ONLY if not cleaning
      - name: Configure ccache
        if: github.event.inputs.clean_ccache == 'no'
        run: |
          mkdir -p ${{ env.CCACHE_DIR }}
          ccache --set-config=cache_dir=${{ env.CCACHE_DIR }}
          ccache --set-config=temporary_dir=/tmp/ccache-tmp
          ccache -M 10G

      # Setup Repo tool
      - name: Setup Repo Tool
        run: |
          mkdir -p ~/.bin
          curl -s https://storage.googleapis.com/git-repo-downloads/repo > ~/.bin/repo
          chmod a+rx ~/.bin/repo
          echo "$HOME/.bin" >> $GITHUB_PATH

      # Prepare Android build dependencies
      - name: Build Environment
        run: |
          git clone https://github.com/akhilnarang/scripts.git -b master scripts
          cd scripts
          sudo bash setup/android_build_env.sh

      # Initialize and sync PBRP source manifest
      - name: Set-up PBRP Manifest
        run: |
          mkdir -p ${GITHUB_WORKSPACE}/pbrp
          cd ${GITHUB_WORKSPACE}/pbrp
          git config --global user.name "${{ github.actor }}"
          git config --global user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"
          repo init -u https://github.com/PitchBlackRecoveryProject/manifest_pb.git -b ${{ github.event.inputs.manifest_branch }} --depth=1
          repo sync -c --no-clone-bundle --no-tags --optimized-fetch --prune --force-sync -j$(nproc --all)

      # Clone/Place Device Tree into workspace
      - name: Clone Device Tree
        run: |
          DEVICE_PATH="device/xiaomi/gold"
          DEVICE_TREE="${{ github.event.inputs.device_tree_url }}"
          DEVICE_TREE_BRANCH="${{ github.event.inputs.device_tree_branch }}"

          if [ -z "$DEVICE_TREE" ]; then
            DEVICE_TREE="${{ github.server_url }}/${{ github.repository }}"
          fi

          if [ -z "$DEVICE_TREE_BRANCH" ]; then
            DEVICE_TREE_BRANCH="${{ github.ref_name }}"
          fi

          cd ${GITHUB_WORKSPACE}/pbrp
          rm -rf "$DEVICE_PATH"
          git clone "$DEVICE_TREE" -b "$DEVICE_TREE_BRANCH" "$DEVICE_PATH"
          cd "$DEVICE_PATH"
          echo "COMMIT_ID=$(git rev-parse HEAD)" >> $GITHUB_ENV

      # Compile PitchBlack Recovery
      - name: Building PitchBlack Recovery
        run: |
          export DEVICE_NAME=gold
          cd ${GITHUB_WORKSPACE}/pbrp
          set +e
          source build/envsetup.sh
          export ALLOW_MISSING_DEPENDENCIES=true
          export USE_CCACHE=1
          set -e
          lunch pb_${DEVICE_NAME}-eng
          mka pbrp vendorbootimage -j$(nproc --all)

          # Collect output artifacts
          mkdir -p ${GITHUB_WORKSPACE}/output
          cd ${GITHUB_WORKSPACE}/pbrp/out/target/product/${DEVICE_NAME}

          if [ -f vendor_boot.img ]; then
            cp vendor_boot.img ${GITHUB_WORKSPACE}/output/vendor_boot.img
            cp vendor_boot.img ${GITHUB_WORKSPACE}/output/PBRP-${DEVICE_NAME}-vendor_boot.img
          fi

          if [ -f recovery.img ]; then
            cp recovery.img ${GITHUB_WORKSPACE}/output/recovery.img
          fi

          find . -maxdepth 1 -name "PBRP*.zip" -exec cp {} ${GITHUB_WORKSPACE}/output/ \;

          echo "BUILD_DATE=$(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_ENV
          echo "=== Collected Output Files ==="
          ls -la ${GITHUB_WORKSPACE}/output

      # Show stats ONLY if ccache used
      - name: Cache Stats
        if: github.event.inputs.clean_ccache == 'no'
        run: ccache -s

      # Upload build artifacts to GitHub Release
      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ github.workspace }}/output/*
          name: PitchBlack Recovery for Redmi Note 13 5G (gold)
          tag_name: ${{ github.run_id }}
          body: |
            ## PitchBlack Recovery Project - Unofficial Build

            - **Device**: Redmi Note 13 5G
            - **Codename**: `gold`
            - **Architecture**: arm64
            - **Target Partition**: `vendor_boot`
            - **Manifest Branch**: `${{ github.event.inputs.manifest_branch }}`
            - **Commit**: [${{ env.COMMIT_ID }}](${{ github.server_url }}/${{ github.repository }}/commit/${{ env.COMMIT_ID }})
            - **Build Date**: ${{ env.BUILD_DATE }}

            ### Flashing Instructions
            ```bash
            fastboot flash vendor_boot PBRP-gold-vendor_boot.img
            fastboot reboot recovery
            ```

      # Upload build artifacts for workflow run download
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v6
        with:
          name: PBRP-gold-${{ github.event.inputs.manifest_branch }}-${{ github.run_id }}
          path: ${{ github.workspace }}/output/*
          retention-days: 30
