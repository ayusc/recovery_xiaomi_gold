name: AERA Recovery Build

'on':
  workflow_dispatch:

jobs:
  build:
    name: Build AERA Recovery
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    env:
      MANIFEST_URL: https://github.com/AERA-Recovery/android_manifest.git
      MANIFEST_BRANCH: aera-16.0
      DEVICE_PATH: device/xiaomi/gold
      DEVICE_NAME: gold
      BUILD_TARGET: vendorboot
      TZ: UTC
      CCACHE_DIR: /tmp/ccache
      CCACHE_EXEC: /usr/bin/ccache
      USE_CCACHE: 1

    steps:
      - name: Checkout Device Tree
        uses: actions/checkout@v6

      # Free up disk space using custom cleanup action
      - name: Cleanup Runner Environment
        uses: rokibhasansagar/slimhub_actions@main

      - name: Initialize Workspace
        run: |
          echo "Starting AERA Recovery build for ${{ env.DEVICE_NAME }}"
          git config --global --add safe.directory '*'
          mkdir -p workspace
          cd workspace
          echo "workspace-folder=$(pwd)" >> $GITHUB_OUTPUT
        id: pwd

      # Prepare Android build dependencies
      - name: Prepare Build Environment
        run: |
          curl -fL -O "https://gitlab.com/OrangeFox/misc/scripts/-/raw/master/setup/android_build_env.sh"
          sudo bash android_build_env.sh
        working-directory: ${{ steps.pwd.outputs.workspace-folder }}

      # Install Zulu OpenJDK 11
      - name: Install OpenJDK
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: '11'

      # Restore and cache ccache directory across runs
      - name: Setup ccache
        uses: actions/cache@v5
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ runner.os }}-${{ env.DEVICE_NAME }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ env.DEVICE_NAME }}-

      - name: Configure ccache
        run: |
          mkdir -p ${{ env.CCACHE_DIR }}
          ccache --set-config=cache_dir=${{ env.CCACHE_DIR }}
          ccache --set-config=temporary_dir=/tmp/ccache-tmp
          ccache --set-config=compression=true
          ccache -M 10G
          ccache -z

      # Initialize and sync AERA Recovery manifest (shallow clone to conserve disk space)
      - name: Sync AERA Sources
        run: |
          mkdir -p ${{ steps.pwd.outputs.workspace-folder }}/${{ env.MANIFEST_BRANCH }}
          cd ${{ steps.pwd.outputs.workspace-folder }}/${{ env.MANIFEST_BRANCH }}
          git config --global user.name "${{ github.actor }}"
          git config --global user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"
          repo init --depth=1 -u ${{ env.MANIFEST_URL }} -b ${{ env.MANIFEST_BRANCH }}
          repo sync -c --force-sync --no-clone-bundle --no-tags -j$(nproc)

          # Ensure aera_secrets is compiled into recovery for Mobile Data and secrets management
          if [ -f bootable/recovery/Android.mk ] && ! grep -q "LOCAL_SRC_FILES += aera_secrets/aera_secrets.cpp" bootable/recovery/Android.mk; then
            sed -i '/aera_secrets\/aera_secrets\.cpp/d' bootable/recovery/Android.mk
            sed -i '/ifeq (\$(OF_ENABLE_WLAN),1)/i LOCAL_SRC_FILES += aera_secrets/aera_secrets.cpp\n' bootable/recovery/Android.mk
          fi
        working-directory: ${{ steps.pwd.outputs.workspace-folder }}

      # Clone current device tree into device/xiaomi/gold
      - name: Clone Device Tree
        run: |
          cd ${{ steps.pwd.outputs.workspace-folder }}/${{ env.MANIFEST_BRANCH }}
          mkdir -p ${{ env.DEVICE_PATH }}
          git clone --depth=1 https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git -b ${{ github.ref_name }} ./${{ env.DEVICE_PATH }}
          cd ./${{ env.DEVICE_PATH }}
          LATEST_COMMIT=$(git rev-parse --short=7 HEAD)
          echo "COMMIT_ID=$LATEST_COMMIT" >> $GITHUB_ENV
          echo "Latest device tree commit: $LATEST_COMMIT"
        working-directory: ${{ steps.pwd.outputs.workspace-folder }}

      # Set 30 GB Swap to prevent soong_build OOM (exit status 143)
      - name: Set Swap Space
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 30

      # Show system resources before compilation
      - name: Show System Resources
        run: |
          echo "=== CPU Cores ==="
          nproc
          echo
          echo "=== Memory & Swap ==="
          free -h
          echo
          echo "=== Disk Space ==="
          df -h
        working-directory: ${{ steps.pwd.outputs.workspace-folder }}

      # Compile AERA Recovery
      - name: Building Recovery
        run: |
          cd ${{ steps.pwd.outputs.workspace-folder }}/${{ env.MANIFEST_BRANCH }}

          set +e
          source build/envsetup.sh
          export ALLOW_MISSING_DEPENDENCIES=true
          export LC_ALL="C"
          export AERA_BUILD_DEVICE=${{ env.DEVICE_NAME }}
          export USE_CCACHE=1
          export CCACHE_DIR=${{ env.CCACHE_DIR }}
          export CCACHE_EXEC=/usr/bin/ccache
          set -e

          lunch twrp_${{ env.DEVICE_NAME }}-bp2a-eng || lunch aera_${{ env.DEVICE_NAME }}-bp2a-eng

          mka adbd ${{ env.BUILD_TARGET }}image -j$(nproc --all)

          # Collect output artifacts
          mkdir -p ${{ github.workspace }}/output
          cd out/target/product/${{ env.DEVICE_NAME }}

          if [ -f vendor_boot.img ]; then
            cp vendor_boot.img ${{ github.workspace }}/output/vendor_boot.img
            cp vendor_boot.img ${{ github.workspace }}/output/AERA-${{ env.DEVICE_NAME }}-vendor_boot.img
          fi

          if [ -f recovery.img ]; then
            cp recovery.img ${{ github.workspace }}/output/recovery.img
            cp recovery.img ${{ github.workspace }}/output/AERA-${{ env.DEVICE_NAME }}-recovery.img
          fi

          find . -maxdepth 1 -name "AERA*.zip" -exec cp {} ${{ github.workspace }}/output/ \; 2>/dev/null || true
          find . -maxdepth 1 -name "aera*.zip" -exec cp {} ${{ github.workspace }}/output/ \; 2>/dev/null || true
          find . -maxdepth 1 -name "AERA*.img" -exec cp {} ${{ github.workspace }}/output/ \; 2>/dev/null || true

          echo "BUILD_DATE=$(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_ENV
          echo "=== Collected Output Files ==="
          ls -lh ${{ github.workspace }}/output
        working-directory: ${{ steps.pwd.outputs.workspace-folder }}

      # Show ccache statistics after build
      - name: Show ccache stats
        run: |
          ccache -s

      # Show system resources post-build
      - name: Show System Resources Post-Build
        run: |
          echo "=== Memory & Swap ==="
          free -h
          echo
          echo "=== Disk Space ==="
          df -h
        working-directory: ${{ steps.pwd.outputs.workspace-folder }}

      # Upload build artifacts to GitHub Release
      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ github.workspace }}/output/*
          name: AERA Recovery for Redmi Note 13 5G (${{ env.DEVICE_NAME }})
          tag_name: ${{ github.run_id }}
          body: |
            ## AERA Recovery Project - Unofficial Build

            - **Maintainer**: Ayus
            - **Device**: Redmi Note 13 5G
            - **Codename**: ${{ env.DEVICE_NAME }}
            - **Architecture**: arm64
            - **Target Partition**: vendor_boot
            - **Manifest Branch**: ${{ env.MANIFEST_BRANCH }}
            - **Features**: Native LVGL UI, Root Manager (KernelSU/SukiSU for Kernel 6.6), Mobile Data, Web PC Control, FBE v2 Decryption, Fastbootd
            - **Device Tree Branch**: ${{ github.ref_name }}
            - **Device Tree Commit**: [${{ env.COMMIT_ID }}](${{ github.server_url }}/${{ github.repository }}/commit/${{ env.COMMIT_ID }})
            - **Build Date**: ${{ env.BUILD_DATE }}

            ### Flashing Instructions
            ```bash
            fastboot flash vendor_boot AERA-${{ env.DEVICE_NAME }}-vendor_boot.img
            fastboot reboot recovery
            ```
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Upload build artifacts to GitHub Actions workflow run
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AERA-${{ env.DEVICE_NAME }}-${{ github.run_id }}
          path: ${{ github.workspace }}/output/*
          retention-days: 30
