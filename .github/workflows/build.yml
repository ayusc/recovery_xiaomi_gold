name: AERA Builder

on:
  push:
    branches:
      - "main"
    paths-ignore:
      - "README.md"
      - ".gitignore"
  workflow_dispatch:
    inputs:
      SYNC_URL:
        description: "AERA manifest repository URL"
        required: true
        type: string
        default: "https://github.com/AERA-Recovery/android_manifest.git"
      MANIFEST_BRANCH:
        description: "AERA manifest branch"
        required: true
        type: choice
        default: "aera-16.0"
        options:
          - "aera-16.0"
      DEVICE_TREE_URL:
        description: "Device tree repository URL"
        required: true
        type: string
        default: "https://github.com/ayusc/recovery_xiaomi_gold"
      DEVICE_TREE_BRANCH:
        description: "AERA device tree branch"
        required: true
        type: string
        default: "main"
      DEVICE_PATH:
        description: "Device path in the source tree"
        required: true
        type: string
        default: "device/xiaomi/gold"
      LUNCH_PRODUCT:
        description: "AERA lunch product"
        required: true
        type: string
        default: "twrp_gold-bp2a"
      BUILD_TYPE:
        description: "Build variant"
        required: true
        type: choice
        default: "eng"
        options:
          - "eng"
          - "userdebug"
          - "user"
      BUILD_TARGET:
        description: "Build target (mka adbd <target>)"
        required: true
        type: choice
        default: "vendorbootimage"
        options:
          - "vendorbootimage"
          - "recoveryimage"
          - "bootimage"
      SWAP_SIZE_GB:
        description: "Swap size in GB (0 to disable)"
        required: true
        type: string
        default: "28"
      JAVA_VERSION:
        description: "OpenJDK version (Zulu distribution)"
        required: true
        type: string
        default: "11"
      PUBLISH_RELEASE:
        description: "Publish a GitHub release (otherwise upload a workflow artifact)"
        required: true
        type: boolean
        default: true
      RELEASE_NOTE:
        description: "Extra text for the top of the release notes"
        required: false
        type: string
        default: ""

permissions:
  contents: write

jobs:
  build:
    name: Build AERA Recovery
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    defaults:
      run:
        shell: bash
    env:
      DEBIAN_FRONTEND: noninteractive
      SYNC_URL: ${{ inputs.SYNC_URL || 'https://github.com/AERA-Recovery/android_manifest.git' }}
      MANIFEST_BRANCH: ${{ inputs.MANIFEST_BRANCH || 'aera-16.0' }}
      DEVICE_TREE_URL: ${{ inputs.DEVICE_TREE_URL || 'https://github.com/ayusc/recovery_xiaomi_gold' }}
      DEVICE_TREE_BRANCH: ${{ inputs.DEVICE_TREE_BRANCH || 'main' }}
      DEVICE_PATH: ${{ inputs.DEVICE_PATH || 'device/xiaomi/gold' }}
      LUNCH_PRODUCT: ${{ inputs.LUNCH_PRODUCT || 'twrp_gold-bp2a' }}
      BUILD_TYPE: ${{ inputs.BUILD_TYPE || 'eng' }}
      BUILD_TARGET: ${{ inputs.BUILD_TARGET || 'vendorbootimage' }}
      SWAP_SIZE_GB: ${{ inputs.SWAP_SIZE_GB || '28' }}
      JAVA_VERSION: ${{ inputs.JAVA_VERSION || '11' }}
      PUBLISH_RELEASE: ${{ inputs.PUBLISH_RELEASE == false && 'false' || 'true' }}
      RELEASE_NOTE: ${{ inputs.RELEASE_NOTE || '' }}

    steps:
      - name: Cleanup
        uses: rokibhasansagar/slimhub_actions@main

      - name: Initialize workspace
        run: |
          set -euo pipefail

          [[ "$SWAP_SIZE_GB" =~ ^[0-9]+$ ]] || { echo "::error::SWAP_SIZE_GB must be a whole number"; exit 1; }
          [[ "$LUNCH_PRODUCT" =~ ^[A-Za-z0-9_-]+$ ]] || { echo "::error::LUNCH_PRODUCT contains invalid characters"; exit 1; }
          case "$DEVICE_PATH" in
            /* | *..*) echo "::error::DEVICE_PATH must be a relative path"; exit 1 ;;
          esac

          git config --global user.name "Ayus"
          git config --global user.email "ayuschatterjee2003@gmail.com"
          git config --global --add safe.directory '*'

          src="$GITHUB_WORKSPACE/workspace/$MANIFEST_BRANCH"
          mkdir -p "$src"

          cat > "$RUNNER_TEMP/resources.sh" <<'EOF'
          echo "========== ${1^^} RESOURCE DIAGNOSTICS =========="

          echo "CPU cores available:"
          nproc

          echo "CPU cores installed:"
          nproc --all

          echo "Memory:"
          free -h

          echo "Swap:"
          swapon --show

          echo "Disk:"
          df -h

          for f in memory.events memory.peak; do
            echo "Cgroup $f:"
            if [ -f "/sys/fs/cgroup/$f" ]; then
              cat "/sys/fs/cgroup/$f"
            else
              echo "$f unavailable"
            fi
          done

          echo "Kernel OOM messages:"
          sudo dmesg -T 2>/dev/null | grep -iE 'oom|out of memory|killed process' | tail -30 || true

          echo "===================================================="
          EOF

          {
            echo "JOB_START=$(date +%s)"
            echo "SRC_DIR=$src"
            echo "RESOURCES_SH=$RUNNER_TEMP/resources.sh"
            echo "RELEASE_DIR=$RUNNER_TEMP/release"
            echo "NOTES_FILE=$RUNNER_TEMP/notes.md"
            echo "BUILD_LOG=$RUNNER_TEMP/build.log"
            echo "BUILD_MARK=$RUNNER_TEMP/build.start"
            echo "LUNCH_COMBO=${LUNCH_PRODUCT}-${BUILD_TYPE}"
          } >> "$GITHUB_ENV"

      - name: Install dependencies
        run: |
          set -euo pipefail
          sudo apt-get update

          sudo apt-get install -y \
            git aria2 ccache python3 python-is-python3 bc bison build-essential \
            curl flex g++-multilib gcc-multilib gnupg gperf imagemagick \
            lib32ncurses-dev lib32readline-dev lib32z1-dev liblz4-tool \
            libncurses-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils \
            lzop pngcrush rsync schedtool squashfs-tools xsltproc zip \
            zlib1g-dev unzip openssh-server tmux

          sudo curl --create-dirs -fsSL --retry 5 --retry-all-errors \
            -o /usr/local/bin/repo \
            https://storage.googleapis.com/git-repo-downloads/repo

          sudo chmod a+rx /usr/local/bin/repo

          repo --version

      - name: Install OpenJDK
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: ${{ env.JAVA_VERSION }}

      - name: Sync AERA source
        run: |
          set -euo pipefail
          cd "$SRC_DIR"
          t0=$(date +%s)

          repo init --depth=1 -u "$SYNC_URL" -b "$MANIFEST_BRANCH"
          repo sync -c --force-sync --no-clone-bundle --no-tags -j"$(nproc)"

          version="$(sed -nE 's/^[[:space:]]*AERA_INTERNAL_RELEASE[[:space:]]*:?=[[:space:]]*//p' bootable/recovery/aera_build.mk | head -n1)"
          {
            echo "SYNC_SECONDS=$(( $(date +%s) - t0 ))"
            echo "MANIFEST_SHA=$(git -C .repo/manifests rev-parse --short=10 HEAD)"
            echo "RECOVERY_SHA=$(git -C bootable/recovery rev-parse --short=10 HEAD)"
            echo "AERA_RELEASE_VERSION=${version:-unknown}"
          } >> "$GITHUB_ENV"
          df -h "$SRC_DIR"

      - name: Clone device tree
        run: |
          set -euo pipefail
          cd "$SRC_DIR"
          if ! git clone --depth=1 --branch "$DEVICE_TREE_BRANCH" "$DEVICE_TREE_URL" "$DEVICE_PATH"; then
            echo "::error::Cannot clone branch '$DEVICE_TREE_BRANCH' of $DEVICE_TREE_URL"
            exit 1
          fi
          url="${DEVICE_TREE_URL%/}"
          {
            echo "DT_URL=${url%.git}"
            echo "DT_SHA=$(git -C "$DEVICE_PATH" rev-parse HEAD)"
          } >> "$GITHUB_ENV"

      - name: Set Swap Space
        if: ${{ env.SWAP_SIZE_GB != '0' }}
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: ${{ env.SWAP_SIZE_GB }}

      - name: Show system resources before build
        run: bash "$RESOURCES_SH" pre-build

      - name: Build AERA Recovery
        run: |
          cd "$SRC_DIR"

          set +e
          source build/envsetup.sh
          export ALLOW_MISSING_DEPENDENCIES=true
          export LC_ALL="C"
          export GOMEMLIMIT=8GiB
          export GOGC=40
          export MALLOC_ARENA_MAX=2
          set -e

          lunch "$LUNCH_COMBO" || { echo "::error::lunch $LUNCH_COMBO failed"; exit 1; }
          echo "PRODUCT_OUT=$OUT" >> "$GITHUB_ENV"

          touch "$BUILD_MARK"
          t0=$(date +%s)

          if ! mka adbd "$BUILD_TARGET" -j"$(nproc --all)" 2>&1 | tee "$BUILD_LOG"; then
            echo "::error::Build failed for $LUNCH_COMBO"
            exit 1
          fi

          echo "BUILD_SECONDS=$(( $(date +%s) - t0 ))" >> "$GITHUB_ENV"

      - name: Show system resources after build
        if: always()
        run: bash "$RESOURCES_SH" post-build

      - name: Collect outputs and release notes
        run: |
          set -euo pipefail
          mkdir -p "$RELEASE_DIR"
          codename="${DEVICE_PATH##*/}"

          # Primary images for recovery / vendor_boot
          if [ -f "$PRODUCT_OUT/vendor_boot.img" ]; then
            cp -f "$PRODUCT_OUT/vendor_boot.img" "$RELEASE_DIR/vendor_boot.img"
            cp -f "$PRODUCT_OUT/vendor_boot.img" "$RELEASE_DIR/recovery.img"
            cp -f "$PRODUCT_OUT/vendor_boot.img" "$RELEASE_DIR/AERA-${codename}-vendor_boot.img"
          fi
          if [ -f "$PRODUCT_OUT/recovery.img" ] && [ ! -f "$RELEASE_DIR/recovery.img" ]; then
            cp -f "$PRODUCT_OUT/recovery.img" "$RELEASE_DIR/recovery.img"
          fi

          # Copy flashable zips and branded output images
          find "$PRODUCT_OUT" -maxdepth 1 -type f \( -name 'AERA*.zip' -o -name 'AERA*.img' \) \
            -newer "$BUILD_MARK" -exec cp -t "$RELEASE_DIR" {} +

          # Purge raw intermediate ramdisk
          rm -f "$RELEASE_DIR/ramdisk.img"

          [ -n "$(ls -A "$RELEASE_DIR")" ] || { echo "::error::No build outputs found in $PRODUCT_OUT"; exit 1; }

          fmt() { printf '%dh %02dm %02ds' $(($1 / 3600)) $(($1 % 3600 / 60)) $(($1 % 60)); }
          total=$(( $(date +%s) - JOB_START ))
          built_at="$(date -u '+%Y-%m-%d %H:%M UTC')"
          codename="${DEVICE_PATH##*/}"

          tag="aera-${codename}-$(date -u +%Y%m%d)-${GITHUB_RUN_NUMBER}"
          if [ "$GITHUB_RUN_ATTEMPT" -gt 1 ]; then tag="${tag}-${GITHUB_RUN_ATTEMPT}"; fi

          files=""
          for f in "$RELEASE_DIR"/*; do
            files+="| $(basename "$f") | $(du -h "$f" | cut -f1) | \`$(sha256sum "$f" | cut -d' ' -f1)\` |"$'\n'
          done

          {
            if [ -n "$RELEASE_NOTE" ]; then printf '%s\n\n' "$RELEASE_NOTE"; fi
            cat <<EOF
          ## AERA ${AERA_RELEASE_VERSION} for ${codename}

          Unofficial automated build.

          ### Build details
          | | |
          |---|---|
          | Built | ${built_at} |
          | Build time | $(fmt "$BUILD_SECONDS") |
          | Sync time | $(fmt "$SYNC_SECONDS") |
          | Total workflow time | $(fmt "$total") |
          | Manifest | ${MANIFEST_BRANCH} (\`${MANIFEST_SHA}\`) |
          | Recovery source | \`${RECOVERY_SHA}\` |
          | Lunch | \`${LUNCH_COMBO}\` |
          | Target | \`mka adbd ${BUILD_TARGET}\` |
          | Workflow run | [#${GITHUB_RUN_NUMBER}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}) |

          ### Device tree
          [${DT_URL}](${DT_URL}/tree/${DEVICE_TREE_BRANCH}), branch \`${DEVICE_TREE_BRANCH}\`, commit [\`${DT_SHA:0:10}\`](${DT_URL}/commit/${DT_SHA})

          ### Files
          | File | Size | SHA-256 |
          |---|---|---|
          ${files}
          EOF
          } > "$NOTES_FILE"

          {
            echo "CODENAME=$codename"
            echo "RELEASE_TAG=$tag"
            echo "RELEASE_TITLE=AERA ${AERA_RELEASE_VERSION} | ${codename} | ${built_at}"
          } >> "$GITHUB_ENV"
          cat "$NOTES_FILE" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish release
        if: ${{ env.PUBLISH_RELEASE == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" "$RELEASE_DIR"/* \
            --title "$RELEASE_TITLE" \
            --notes-file "$NOTES_FILE" \
            --target "$GITHUB_SHA"

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: aera-${{ env.CODENAME }}-${{ github.run_number }}
          path: ${{ env.RELEASE_DIR }}/*
          if-no-files-found: error

      - name: Upload build log
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.run_number }}
          path: ${{ env.BUILD_LOG }}
          if-no-files-found: ignore
          retention-days: 7
